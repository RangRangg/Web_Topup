<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#070b14" />
            <stop offset="50%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#050811" />
        </linearGradient>
        <linearGradient id="text-accent" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>
        <radialGradient id="glow-cyan" cx="20%" cy="30%" r="40%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="glow-purple" cx="80%" cy="70%" r="45%">
            <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25" />
            <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
        </radialGradient>
    </defs>
    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg)" />
    <circle cx="250" cy="200" r="350" fill="url(#glow-cyan)" />
    <circle cx="950" cy="450" r="400" fill="url(#glow-purple)" />
    
    <!-- Cyber Grid Line Pattern -->
    <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
        <line x1="0" y1="105" x2="1200" y2="105" />
        <line x1="0" y1="210" x2="1200" y2="210" />
        <line x1="0" y1="315" x2="1200" y2="315" />
        <line x1="0" y1="420" x2="1200" y2="420" />
        <line x1="0" y1="525" x2="1200" y2="525" />
        <line x1="200" y1="0" x2="200" y2="630" />
        <line x1="400" y1="0" x2="400" y2="630" />
        <line x1="600" y1="0" x2="600" y2="630" />
        <line x1="800" y1="0" x2="800" y2="630" />
        <line x1="1000" y1="0" x2="1000" y2="630" />
    </g>

    <!-- Logo & Icon -->
    <g transform="translate(140, 160)">
        <!-- Emblem -->
        <rect width="100" height="100" rx="24" fill="#0f172a" stroke="#22d3ee" stroke-width="2.5" />
        <path d="M50 20L72 70H60L55 58H45L40 70H28L50 20ZM50 36L47 48H53L50 36Z" fill="url(#text-accent)" />
        <circle cx="50" cy="78" r="4" fill="#22d3ee" />
    </g>

    <!-- Main Typography -->
    <text x="270" y="210" font-family="'Instrument Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
