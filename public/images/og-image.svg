        <rect width="260" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="20" y="32" font-family="'Instrument Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">⚡ 15.000+ ORDER SELESAI</text>

        <!-- Badge 2 -->
        <rect x="280" width="260" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="300" y="32" font-family="'Instrument Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#a855f7">🛡️ 100% GARANSI AMAN</text>

        <!-- Badge 3 -->
        <rect x="560" width="260" height="52" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="580" y="32" font-family="'Instrument Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#10b981">🤖 AETHEREAL AI POWERED</text>
    </g>

    <!-- Web URL -->
    <text x="1060" y="585" text-anchor="end" font-family="'Instrument Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#64748b">
