    </text>
    <text x="272" y="250" font-family="'Instrument Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#06b6d4" letter-spacing="4">
        NEXT-GEN GAMING ECOSYSTEM &amp; AI ASSISTANT
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="140" y="360" font-family="'Instrument Sans', system-ui, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1">
        Platform Top Up Instan &amp; Jasa Joki Pro Bergaransi #1 di Indonesia.
    </text>
    <text x="140" y="405" font-family="'Instrument Sans', system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
        Pro Booster Terverifikasi • 100% Anti Banned • Konsultasi Cerdas Aethereal AI • Instan 24/7
    </text>

    <!-- Trust Badges -->
    <g transform="translate(140, 475)">
